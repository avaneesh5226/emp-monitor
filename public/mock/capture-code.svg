<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <rect width="640" height="400" fill="#1c1916"/>
  <rect x="0" y="0" width="168" height="400" fill="#2a2521"/>
  <text x="18" y="36" fill="#efeae1" font-family="ui-monospace, monospace" font-size="13">floor</text>
  <text x="18" y="64" fill="#c4b8a6" font-family="ui-monospace, monospace" font-size="12">notes.js</text>
  <text x="18" y="88" fill="#8a8174" font-family="ui-monospace, monospace" font-size="12">dates.js</text>
  <text x="18" y="112" fill="#8a8174" font-family="ui-monospace, monospace" font-size="12">server.js</text>
  <text x="196" y="48" fill="#8f3d1b" font-family="ui-monospace, monospace" font-size="14">function elapsed(row)</text>
  <text x="196" y="78" fill="#efeae1" font-family="ui-monospace, monospace" font-size="14">  start = clock(row.clockIn)</text>
  <text x="196" y="108" fill="#efeae1" font-family="ui-monospace, monospace" font-size="14">  stop = clock(row.clockOut)</text>
  <text x="196" y="138" fill="#c4b8a6" font-family="ui-monospace, monospace" font-size="14">  return hours(stop - start)</text>
  <text x="196" y="180" fill="#6b8f71" font-family="ui-monospace, monospace" font-size="14">// 8h 35m on a full day</text>
</svg>
