# Auto-deploy to test server on push to main
#
# Required GitHub Secrets:
#   DEPLOY_HOST     - Test server IP (163.227.174.141)
#   DEPLOY_USER     - SSH username (empcloud-development)
#   DEPLOY_PASSWORD - SSH password

name: Deploy to Test Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Decide whether a test server is configured
        id: target
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -n "$DEPLOY_HOST" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "DEPLOY_HOST is not set, so this push does not SSH to the test server."
          fi

      - name: Deploy via SSH
        if: steps.target.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            source ~/.nvm/nvm.sh
            cd /home/empcloud-development/empcloud-projects/empmonitor
            git pull origin main
            npm install
            VITE_API_URL=/api/v3 npm run build
            cd backend && npm install
            cd ..
            pm2 restart emp-monitor
